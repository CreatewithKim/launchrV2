name: CI

# Runs on every pull request and on pushes to main.
# Make `verify` and `database-tests` REQUIRED checks on main (branch protection / ruleset)
# so only code that passes reaches production. Vercel deploys main after merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install (exact versions from package-lock.json)
        run: npm ci --legacy-peer-deps
      - name: Type check
        run: npm run check
      - name: Unit and isolation tests (in-memory mode)
        run: npm test
      - name: Production build (client + server bundles)
        run: npm run build
      - name: Check the Vercel function bundle exists
        run: test -f dist/vercel-api.mjs && test -f dist/public/index.html

  database-tests:
    name: database-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: launchr_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_URL: mysql://root:ci_root_pw@127.0.0.1:3306/launchr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Apply all migrations to an empty database
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.DB_URL }}
      - name: Integration tests against real MySQL
        run: npx vitest run server/sql.integration.test.ts
        env:
          TEST_DATABASE_URL: ${{ env.DB_URL }}

  audit:
    name: audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports known vulnerabilities without blocking merges while the
    # Drizzle ORM advisory (F14) is open. Remove continue-on-error once fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm audit --omit=dev --audit-level=high
